<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Activate MailHub</title>
<link rel="stylesheet" href="activation.css" />
</head>
<body>
  <div class="glow"></div>
  <div class="noise"></div>
  <div class="drag-region"></div>

  <main class="card" id="card">
    <div class="mark">
      <svg viewBox="0 0 32 32" width="40" height="40">
        <rect width="32" height="32" rx="8" fill="#6366f1"/>
        <path d="M6 11.5 16 18l10-6.5V21a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9.5Z" fill="#fff" opacity="0.95"/>
        <path d="M6.4 9h19.2L16 15.2 6.4 9Z" fill="#fff"/>
      </svg>
      <span class="wordmark">MailHub</span>
    </div>

    <h1>Activate your license</h1>
    <p class="sub">One inbox for every domain you own — this copy just needs to know it's yours.</p>

    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Drop your license file, or click to browse">
      <svg class="dz-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="dz-primary">Drop your <code>.license</code> file here</p>
      <p class="dz-secondary">or click to browse</p>
    </div>

    <button class="link-toggle" id="pasteToggle" type="button">Paste license text instead</button>

    <div class="paste-area" id="pasteArea">
      <textarea id="pasteInput" placeholder="Paste the full contents of your .license file here…" spellcheck="false"></textarea>
      <button class="btn btn-primary" id="pasteSubmit" type="button">Activate</button>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <footer>
      <button class="link-quiet" id="purchaseLink" type="button">Don't have a license? Get MailHub →</button>
      <span class="version" id="version"></span>
    </footer>
  </main>

  <script src="activation.js"></script>
</body>
</html>
